## Creating and Managing Branches in Git

### Creating Branches

**Create a new branch:**
```bash
git branch <branch-name>
```
Example:
```bash
git branch feature/user-authentication
```

**Create and switch to a new branch in one command:**
```bash
git checkout -b <branch-name>
```
or (Git 2.23+):
```bash
git switch -c <branch-name>
```
Example:
```bash
git checkout -b feature/user-authentication
```

### Switching Between Branches

**Switch to an existing branch:**
```bash
git checkout <branch-name>
```
Example:
```bash
git checkout main
```

**Using the newer syntax (Git 2.23+):**
```bash
git switch <branch-name>
```

### Listing Branches

**List local branches:**
```bash
git branch
```

**List all branches (local and remote):**
```bash
git branch -a
```

**List remote branches:**
```bash
git branch -r
```

### Merging Branches

**Merge a branch into your current branch:**
```bash
git merge <branch-name>
```

Example workflow:
```bash
git checkout main
git merge feature/user-authentication
```

This integrates all commits from `feature/user-authentication` into `main`. If there are no conflicts, Git performs a "fast-forward" merge if possible.

**Merge with a merge commit (even if fast-forward is possible):**
```bash
git merge --no-ff <branch-name>
```

### Rebasing Branches

**Rebase your current branch onto another branch:**
```bash
git rebase <base-branch>
```

Example:
```bash
git checkout feature/user-authentication
git rebase main
```

This replays all commits from `feature/user-authentication` on top of `main`, creating a linear history.

**Interactive rebase (squash, reorder, or edit commits):**
```bash
git rebase -i HEAD~<number-of-commits>
```

Example (rebase last 3 commits):
```bash
git rebase -i HEAD~3
```

This opens an editor where you can:
- `pick` – keep the commit
- `squash` (or `s`) – combine with previous commit
- `reword` (or `r`) – edit the commit message
- `drop` (or `d`) – remove the commit

### Deleting Branches

**Delete a local branch:**
```bash
git branch -d <branch-name>
```

**Force delete a local branch:**
```bash
git branch -D <branch-name>
```

**Delete a remote branch:**
```bash
git push origin --delete <branch-name>
```

### Merge vs. Rebase Summary

| Approach | Command | Use Case |
|----------|---------|----------|
| **Merge** | `git merge <branch>` | Keep complete history; safe for shared branches |
| **Rebase** | `git rebase <base>` | Linear history; better for feature branches before merging |

**Merge creates a commit showing the integration point; Rebase replays commits on top of the base branch without an explicit merge commit.**
